<title>Armadio Digitale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una colonna da telefono, griglia di capi come cartellini appesi, barra di navigazione in basso. */
:root {
  --bg: #eef0ec; --surface: #ffffff; --sunk: #e3e6e0; --ink: #1d2320; --muted: #5d665f;
  --line: #d3d8d0; --accent: #1f5c57; --accent-ink: #ffffff; --accent-soft: #d6e7e3;
  --ok: #2f7a3d; --warn: #9a6a00; --bad: #b3261e; --tag-ai: #dfe8f7; --tag-label: #e2f0e1;
  --tag-you: #f6ead2; --tag-px: #ece3f5;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px; --bar-h: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121614; --surface: #1b201e; --sunk: #232a27; --ink: #e8ece9; --muted: #9aa59e;
  --line: #2e3733; --accent: #7cc2b8; --accent-ink: #0e1a18; --accent-soft: #1f3632;
  --ok: #7ccf8a; --warn: #e3b54f; --bad: #f08a80; --tag-ai: #233148; --tag-label: #233a26;
  --tag-you: #3f3320; --tag-px: #33273f; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #121614; --surface: #1b201e; --sunk: #232a27; --ink: #e8ece9; --muted: #9aa59e;
  --line: #2e3733; --accent: #7cc2b8; --accent-ink: #0e1a18; --accent-soft: #1f3632;
  --ok: #7ccf8a; --warn: #e3b54f; --bad: #f08a80; --tag-ai: #233148; --tag-label: #233a26;
  --tag-you: #3f3320; --tag-px: #33273f; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); }
main { padding-inline: 16px; padding-block: 12px calc(var(--bar-h) + 24px); max-width: 760px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 26px; } h2 { font-size: 19px; } h3 { font-size: 16px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.02em; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 16px; font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn:disabled { opacity: .5; cursor: default; }
.banner { background: var(--sunk); border-radius: var(--r); padding: 10px 14px; font-size: 14px; }
.banner.warn { border-left: 4px solid var(--warn); }

/* Testata */
.top { display: flex; justify-content: space-between; align-items: end; gap: 12px; padding-block: 8px 12px; }
.top .count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }

/* Filtri */
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Griglia dei capi: ogni carta è un cartellino con il foro in alto */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 12px; }
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; text-align: left; display: grid; gap: 8px; min-width: 0; }
.card::before { content: ""; position: absolute; top: 8px; right: 10px; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--bg); }
.card .ph { aspect-ratio: 1; border-radius: 10px; background: var(--sunk); display: grid; place-items: center; overflow: hidden; }
.card .ph img { width: 100%; height: 100%; object-fit: contain; }
.card .name { font-weight: 600; font-size: 14px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line); vertical-align: -2px; flex: none; }
.ph .glyph { font-family: var(--f-display); font-size: 40px; color: var(--muted); }

.empty { text-align: center; padding: 40px 16px; display: grid; gap: 12px; justify-items: center; }

/* Barra in basso */
nav.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5; }
nav.bar button { border: 0; background: none; padding: 10px 4px; display: grid; justify-items: center; gap: 2px; font-size: 12px; color: var(--muted); height: var(--bar-h); }
nav.bar button[aria-current="page"] { color: var(--accent); font-weight: 600; }
nav.bar svg { width: 22px; height: 22px; }
nav.bar .add span.plus { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 26px; line-height: 1; margin-top: -6px; }

/* Foglio modale */
.sheet-wrap { position: fixed; inset: 0; background: rgba(10,14,12,.45); display: grid; align-items: end; z-index: 10; }
.sheet { background: var(--bg); border-radius: 18px 18px 0 0; max-height: 92%; overflow-y: auto; padding-inline: 16px; padding-block: 14px calc(20px + env(safe-area-inset-bottom, 0px)); width: 100%; max-width: 760px; margin: 0 auto; }
.sheet header { display: flex; justify-content: space-between; align-items: center; gap: 8px; position: sticky; top: -14px; background: var(--bg); padding-block: 4px 10px; z-index: 1; }
.choice { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; text-align: left; width: 100%; }
.choice .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.choice small { display: block; color: var(--muted); font-size: 13px; }

/* Editor */
.preview { display: flex; gap: 10px; overflow-x: auto; }
.preview figure { margin: 0; flex: none; width: 140px; }
.preview .frame { width: 140px; height: 140px; border-radius: 12px; overflow: hidden; display: grid; place-items: center; background: repeating-conic-gradient(var(--sunk) 0 25%, var(--surface) 0 50%) 0 / 16px 16px; border: 1px solid var(--line); }
.preview .frame img { max-width: 100%; max-height: 100%; }
.preview figcaption { font-size: 12px; color: var(--muted); margin-top: 4px; }
.field { display: grid; gap: 6px; }
.field > label, .field > .lab { font-size: 13px; font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.field input[type=text], .field input[type=number], .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; }
.field textarea { min-height: 60px; resize: vertical; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 11px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 6px; }
.palette button { aspect-ratio: 1; border-radius: 10px; border: 2px solid transparent; outline: 1px solid var(--line); }
.palette button[aria-pressed="true"] { border-color: var(--ink); outline: 2px solid var(--surface); }
.palette .none { background: var(--surface); font-size: 11px; color: var(--muted); }
.src { font-family: var(--f-mono); font-size: 10.5px; font-weight: 500; padding: 1px 7px; border-radius: 999px; letter-spacing: .03em; }
.src.ai { background: var(--tag-ai); } .src.etichetta { background: var(--tag-label); } .src.tu { background: var(--tag-you); } .src.pixel { background: var(--tag-px); }
.hint { font-size: 12.5px; color: var(--muted); }
.status { display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; font-size: 14px; }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: sp 0.9s linear infinite; flex: none; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; position: sticky; bottom: calc(-20px - env(safe-area-inset-bottom, 0px)); background: var(--bg); padding-block: 10px; }
.err { color: var(--bad); font-size: 14px; }

/* Outfit */
.outfit { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; }
.outfit .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; }
.outfit .it { display: grid; gap: 4px; font-size: 12px; min-width: 0; }
.outfit .it .ph { aspect-ratio: 1; background: var(--sunk); border-radius: 8px; overflow: hidden; display: grid; place-items: center; }
.outfit .it .ph img { width: 100%; height: 100%; object-fit: contain; }
.outfit .why { font-size: 13px; color: var(--muted); }
.score { font-family: var(--f-mono); font-size: 12px; }
.opinion { white-space: pre-wrap; background: var(--accent-soft); border-radius: var(--r); padding: 12px; font-size: 14px; }

/* Qualità */
table.q { width: 100%; border-collapse: collapse; font-size: 14px; }
table.q th, table.q td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.q td.n { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.pill { font-family: var(--f-mono); font-size: 11px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.pill.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.pill.na { background: var(--sunk); color: var(--muted); }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 10px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.kpi b { font-family: var(--f-display); font-size: 24px; display: block; font-variant-numeric: tabular-nums; }
</style>

<main id="app" aria-live="polite"></main>
<nav class="bar" id="bar" aria-label="Sezioni">
  <button data-view="armadio" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4a2 2 0 1 1 2 2c-1 0-2 .6-2 1.6V8l8.4 6.3c.9.7.4 2.2-.8 2.2H4.4c-1.2 0-1.7-1.5-.8-2.2L12 8"/></svg>Armadio</button>
  <button data-view="aggiungi" class="add" aria-label="Aggiungi un capo"><span class="plus">+</span></button>
  <button data-view="outfit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3l-4 3 2 4 2-1v12h8V9l2 1 2-4-4-3c-.5 1.5-2 2.5-4 2.5S8.5 4.5 8 3z"/></svg>Abbinamenti</button>
  <button data-view="qualita"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Qualità AI</button>
</nav>
<div id="modal"></div>

<script>
"use strict";
// ---------- Vocabolari (stesso schema dati del kit Fase 0) ----------
const CATEGORIE = ["t-shirt/top","camicia","maglieria","felpa","pantaloni","jeans","gonna","shorts","abito","tuta/jumpsuit","giacca","cappotto/giubbotto","scarpe","borsa","accessorio","altro"];
const MACRO = {"t-shirt/top":"sopra","camicia":"sopra","maglieria":"sopra","felpa":"sopra","pantaloni":"sotto","jeans":"sotto","gonna":"sotto","shorts":"sotto","abito":"intero","tuta/jumpsuit":"intero","giacca":"capospalla","cappotto/giubbotto":"capospalla","scarpe":"scarpe","borsa":"accessori","accessorio":"accessori","altro":"altro"};
const MACRO_LABEL = {tutti:"Tutti",sopra:"Sopra",sotto:"Sotto",intero:"Abiti",capospalla:"Capispalla",scarpe:"Scarpe",accessori:"Accessori",altro:"Altro"};
const COLORI = {"nero":"#1a1a1a","bianco":"#f5f5f5","panna":"#efe6d2","grigio chiaro":"#b8b8b8","grigio scuro":"#555555","beige":"#d6c3a0","cammello":"#b5895a","marrone":"#6b4423","blu navy":"#1f2a44","blu":"#2f5bb7","azzurro":"#8fbbe0","verde oliva":"#6b6b2f","verde":"#2e7d4f","verde salvia":"#9cae8f","rosso":"#c0282d","bordeaux":"#6d1a2a","rosa":"#e8a3b5","arancione":"#e07b2a","giallo":"#e8c547","viola":"#6a3d8f","oro":"#c9a443","argento":"#c0c0c8"};
const NEUTRI = new Set(["nero","bianco","panna","grigio chiaro","grigio scuro","beige","cammello","marrone","blu navy"]);
const FANTASIE = ["tinta unita","righe","quadri","pois","floreale","animalier","geometrica","camouflage","stampa/grafica","altro"];
const MATERIALI = ["cotone","lino","lana","cachemire","seta","viscosa","poliestere","nylon","acrilico","denim","pelle","ecopelle","piuma","velluto","misto","non determinabile"];
const FIBRA_A_MATERIALE = {cotone:"cotone",lino:"lino",lana:"lana",cachemire:"cachemire",alpaca:"lana",mohair:"lana",seta:"seta",viscosa:"viscosa",modal:"viscosa",lyocell:"viscosa",poliestere:"poliestere",poliammide:"nylon",acrilico:"acrilico",pelle:"pelle",piuma:"piuma"};
const FIBRE = ["cotone","lino","lana","cachemire","alpaca","mohair","seta","viscosa","modal","lyocell","poliestere","poliammide","elastan","acrilico","pelle","piuma","altro"];
const CALORE_FIBRA = {lino:0,seta:1,viscosa:1,modal:1,lyocell:1,cotone:1.5,poliestere:1.5,poliammide:1.5,acrilico:2,pelle:2.5,lana:3,cachemire:3,alpaca:3,mohair:3,piuma:3};
const STAGIONI = ["primavera","estate","autunno","inverno"];
const CALORE = ["leggero","medio","pesante"];
const FORMALITA = {1:"Sport/casa",2:"Casual",3:"Smart casual",4:"Elegante",5:"Cerimonia"};
const LAVAGGIO = ["lavatrice","a mano","solo a secco","non lavare"];
// Campi valutati per la Fase 0: soglia = quota minima di proposte accettate senza correzione.
const SOGLIE = {"categoria|ai":.90,"colore_primario|ai":.85,"stagioni|ai":.80,"fantasia|ai":.85,"formalita|ai":.75,"materiale|ai":null,"composizione_testo|etichetta":.90,"lavaggio|etichetta":.85,"brand|etichetta":null,"taglia|etichetta":null,"materiale|etichetta":null,"colore_primario|pixel":.80};
const BLOCCANTI = new Set(["categoria|ai","colore_primario|ai","stagioni|ai","composizione_testo|etichetta"]);
const CAMPIONE_MIN = 15;

// ---------- Stato ----------
const S = { view: "armadio", filtro: "tutti", stagione: "tutte", capi: [], db: null, uid: null, sample: null, images: false,
            caricato: false, dbErrore: null, outfitStagione: stagioneCorrente(), outfitFormalita: 2, outfit: null, parere: null };
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function stagioneCorrente(d = new Date()) {
  const m = d.getMonth();
  return m >= 2 && m <= 4 ? "primavera" : m >= 5 && m <= 7 ? "estate" : m >= 8 && m <= 10 ? "autunno" : "inverno";
}

// ---------- Avvio e capability ----------
async function avvia() {
  render();
  const use = n => (window.claude && window.claude.use ? window.claude.use(n) : Promise.resolve(null));
  const [user, db, sample] = await Promise.all([use("user"), use("db"), use("sample")]);
  S.sample = sample;
  if (sample) {
    try { const lim = await sample.limits(); S.images = !!lim.images; } catch { S.images = false; }
  }
  if (user && db) {
    S.uid = await user.id().catch(() => null);
    if (S.uid) {
      S.db = db;
      db.collection("data/users/" + S.uid).onSnapshot(snap => {
        S.capi = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(c => c.tipo === "capo")
          .sort((a, b) => (b.creato || 0) - (a.creato || 0));
        S.caricato = true; render();
      }, e => { S.dbErrore = e.code; S.caricato = true; render(); });
    }
  }
  if (!S.db) S.caricato = true;
  render();
}

// ---------- Rendering principale ----------
function render() {
  document.querySelectorAll("#bar button[data-view]").forEach(b => {
    if (b.dataset.view === "aggiungi") return;
    b.toggleAttribute("aria-current", b.dataset.view === S.view);
    if (b.dataset.view === S.view) b.setAttribute("aria-current", "page");
  });
  const app = $("#app");
  if (S.view === "armadio") app.innerHTML = vistaArmadio();
  else if (S.view === "outfit") app.innerHTML = vistaOutfit();
  else if (S.view === "qualita") app.innerHTML = vistaQualita();
}

function avvisi() {
  const out = [];
  if (!S.caricato) out.push(`<div class="status"><span class="spin"></span>Apro il tuo armadio…</div>`);
  else if (!S.db) out.push(`<div class="banner warn">Salvataggio non disponibile in questa vista: accedi a claude.ai e apri l'app da lì. I capi che aggiungi ora restano solo finché la pagina è aperta.</div>`);
  if (S.dbErrore) out.push(`<div class="banner warn">Il collegamento all'archivio si è interrotto (${esc(S.dbErrore)}). Ricarica la pagina.</div>`);
  if (S.caricato && !S.sample) out.push(`<div class="banner">Riconoscimento con Claude non disponibile in questa vista: puoi comunque inserire i capi a mano.</div>`);
  return out.join("");
}

function vistaArmadio() {
  const capi = S.capi.filter(c => (S.filtro === "tutti" || MACRO[c.categoria] === S.filtro) &&
    (S.stagione === "tutte" || !c.stagioni?.length || c.stagioni.includes(S.stagione)));
  const macroPresenti = ["tutti", ...Object.keys(MACRO_LABEL).filter(k => k !== "tutti" && S.capi.some(c => MACRO[c.categoria] === k))];
  const chips = macroPresenti.map(k => `<button class="chip" data-filtro="${k}" aria-pressed="${S.filtro === k}">${MACRO_LABEL[k]}</button>`).join("");
  const chipsStag = ["tutte", ...STAGIONI].map(s => `<button class="chip" data-stag="${s}" aria-pressed="${S.stagione === s}">${s === "tutte" ? "Tutte le stagioni" : cap(s)}</button>`).join("");
  let corpo;
  if (S.caricato && !S.capi.length) {
    corpo = `<div class="empty"><h2>L'armadio è vuoto</h2>
      <p class="muted">Fotografa un capo steso su uno sfondo chiaro e uniforme: Claude propone categoria, colore e stagione, tu confermi. Puoi aggiungere anche la foto dell'etichetta o inserire tutto a mano.</p>
      <button class="btn primary" data-act="aggiungi">Aggiungi il primo capo</button></div>`;
  } else {
    corpo = `<div class="grid">${capi.map(cartaCapo).join("")}</div>` +
      (S.capi.length && !capi.length ? `<p class="muted" style="margin-top:16px">Nessun capo con questi filtri.</p>` : "");
  }
  return `<div class="top"><div><h1>Armadio</h1><div class="count">${S.capi.length} ${S.capi.length === 1 ? "capo" : "capi"}</div></div></div>
    <div class="stack">${avvisi()}
    ${S.capi.length ? `<div class="chips" role="group" aria-label="Tipo">${chips}</div><div class="chips" role="group" aria-label="Stagione">${chipsStag}</div>` : ""}
    </div>${corpo}`;
}

function cartaCapo(c) {
  const img = c.immagine ? `<img src="${esc(c.immagine)}" alt="">` : `<span class="glyph">${esc((c.categoria || "?")[0].toUpperCase())}</span>`;
  const col = COLORI[c.colore_primario] ? `<span class="sw" style="background:${COLORI[c.colore_primario]}"></span>` : "";
  return `<button class="card" data-capo="${esc(c.id)}"><div class="ph">${img}</div>
    <div class="name">${esc(c.nome || c.categoria || "Capo")}</div>
    <div class="row mono muted">${col}${esc(c.colore_primario || "")}${c.taglia ? " · " + esc(c.taglia) : ""}</div></button>`;
}
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;

// ---------- Foglio modale ----------
function apriFoglio(html, onClose) {
  const m = $("#modal");
  m.innerHTML = `<div class="sheet-wrap"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;

  idx.forEach((i, k) => { if (asg[k] === jMax) { r += px[i * 4]; g += px[i * 4 + 1]; bb += px[i * 4 + 2]; n++; } });
  const hex = "#" + [r, g, bb].map(v => Math.round(v / Math.max(1, n)).toString(16).padStart(2, "0")).join("");
  return { nome: ord[0][0], hex, secondario: ord[1] && ord[1][1] >= 0.15 ? ord[1][0] : null };
}

function miniatura(canvas, lato = 420, alpha = true, maxLen = 150000) {
  for (const l of [lato, 340, 260]) {
    const k = Math.min(1, l / Math.max(canvas.width, canvas.height));
    const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(canvas.width * k)); c.height = Math.max(1, Math.round(canvas.height * k));
    c.getContext("2d").drawImage(canvas, 0, 0, c.width, c.height);
    let url = c.toDataURL("image/webp", 0.82);
    if (!url.startsWith("data:image/webp")) url = alpha ? c.toDataURL("image/png") : c.toDataURL("image/jpeg", 0.8);
    if (url.length < maxLen) return url;
  }
  return null;
}

async function elaboraFoto(b, file, tipo) {
  const etichetta = tipo === "etichetta";
  b.modalita.add(etichetta ? "etichetta" : "foto"); b.errore = null;
  b.stato = ["Preparo la foto…"]; disegnaEditor();
  let canvas;
  try { canvas = await caricaImmagine(file); }
  catch { b.stato = []; b.errore = "Non riesco ad aprire questa immagine: prova con una foto JPG o PNG."; return disegnaEditor(); }
  const jpeg = await toBlob(canvas);
  let dati = null;
  if (S.sample && S.images) {
    b.stato = [etichetta ? "Claude sta leggendo l'etichetta…" : "Claude sta analizzando il capo…"]; disegnaEditor();
    S.ctl = new AbortController();
    const t0 = performance.now();
    try {
      dati = await S.sample.json(etichetta ? PROMPT_ETICHETTA : PROMPT_FOTO, { images: [jpeg], signal: S.ctl.signal });
      b.secondiAI = (b.secondiAI || 0) + (performance.now() - t0) / 1000;
    } catch (e) {
      if (e && e.code === "cancelled") return;
      b.errore = MSG_ERR[e && e.code] || "Analisi non riuscita per un problema temporaneo: riprova o compila a mano.";
      if (e && (e.code === "not_granted" || e.code === "images_unavailable" || e.code === "sampling_disabled")) S.images = false;
    } finally { S.ctl = null; }
  }
  if (S.bozza !== b) return; // editor chiuso nel frattempo
  if (etichetta) {
    const mini = miniatura(canvas, 360, false, 45000); if (mini) b.etichette = [...b.etichette, mini].slice(-2);
    if (dati) applicaEtichetta(b, dati);
  } else {
    b.stato = ["Scontorno il capo…"]; disegnaEditor();
    await new Promise(r => setTimeout(r, 30));
    const box = dati && dati.riquadro && typeof dati.riquadro === "object" ? { x: +dati.riquadro.x, y: +dati.riquadro.y, w: +dati.riquadro.w, h: +dati.riquadro.h } : null;
    const r = scontorna(canvas, box && [box.x, box.y, box.w, box.h].every(Number.isFinite) ? box : null);
    b.immagine = miniatura(r.canvas); b.metodoImmagine = r.metodo; b.colorePixel = r.colore;
    if (r.colore) b.proposta["colore_primario|pixel"] = r.colore.nome;
    if (dati) applicaFoto(b, dati);
    else if (r.colore) { proponi(b, "colore_primario", r.colore.nome, "pixel"); }
  }
  b.stato = []; disegnaEditor();
}

function applicaFoto(b, d) {
  if (d.capo_singolo === false) b.errore = "Nella foto sembrano esserci più capi: controlla la scheda.";
  proponi(b, "nome", typeof d.nome === "string" ? d.nome.slice(0, 80) : null, "ai");
  proponi(b, "categoria", inLista(d.categoria, CATEGORIE), "ai");
  proponi(b, "colore_primario", inLista(d.colore_primario, Object.keys(COLORI)), "ai");
  proponi(b, "colore_secondario", inLista(d.colore_secondario, Object.keys(COLORI)), "ai");
  proponi(b, "fantasia", inLista(d.fantasia, FANTASIE), "ai");
  if (b.fonti.materiale !== "etichetta") proponi(b, "materiale", d.materiale !== "non determinabile" ? inLista(d.materiale, MATERIALI) : null, "ai");
  proponi(b, "stagioni", Array.isArray(d.stagioni) ? STAGIONI.filter(s => d.stagioni.includes(s)) : null, "ai");
  proponi(b, "calore", inLista(d.calore, CALORE), "ai");
  const f = Number(d.formalita); proponi(b, "formalita", f >= 1 && f <= 5 ? Math.round(f) : null, "ai");

}

function testoComposizione(comp) {
  const fmt = c => `${+c.percentuale}% ${c.fibra}`;
  const princ = comp.filter(c => !/fodera/i.test(c.parte || "")), fod = comp.filter(c => /fodera/i.test(c.parte || ""));
  return princ.map(fmt).join(", ") + (fod.length ? ` (fodera: ${fod.map(fmt).join(", ")})` : "");
}
function applicaEtichetta(b, d) {
  if (d.leggibile === false) { b.errore = "L'etichetta non è leggibile: prova con più luce o più da vicino."; return; }
  proponi(b, "brand", typeof d.brand === "string" ? d.brand : null, "etichetta");
  proponi(b, "taglia", typeof d.taglia === "string" ? d.taglia : null, "etichetta");
  proponi(b, "lavaggio", inLista(d.lavaggio, LAVAGGIO), "etichetta");
  const t = Number(d.temperatura_max); proponi(b, "temperatura", d.temperatura_max != null && Number.isFinite(t) ? t : null, "etichetta");
  const comp = Array.isArray(d.composizione) ? d.composizione.filter(c => c && FIBRE.includes(c.fibra) && Number.isFinite(+c.percentuale)) : [];
  if (comp.length) {
    b.valori.composizione = comp;
    proponi(b, "composizione_testo", testoComposizione(comp), "etichetta");
    const princ = comp.filter(c => !/fodera/i.test(c.parte || "")); const base = princ.length ? princ : comp;
    const dom = base.reduce((a, c) => +c.percentuale > +a.percentuale ? c : a);
    if (b.fonti.materiale !== "tu") { b.fonti.materiale = null; proponi(b, "materiale", FIBRA_A_MATERIALE[dom.fibra] || "misto", "etichetta"); }
    // La stagione dalla composizione è solo una stima: la usiamo se la foto non l'ha già indicata.
    if (!b.valori.stagioni?.length) {
      const pesi = base.map(c => [CALORE_FIBRA[c.fibra], +c.percentuale]).filter(([v, p]) => v !== undefined && p > 0);
      if (pesi.length) {
        const ind = pesi.reduce((s, [v, p]) => s + v * p, 0) / pesi.reduce((s, [, p]) => s + p, 0);
        const [cal, st] = ind < 0.8 ? ["leggero", ["primavera", "estate"]] : ind <= 1.6 ? ["medio", ["primavera", "estate", "autunno"]] : ind < 2.4 ? ["medio", ["primavera", "autunno", "inverno"]] : ["pesante", ["autunno", "inverno"]];
        proponi(b, "stagioni", st, "etichetta"); if (!b.valori.calore) proponi(b, "calore", cal, "etichetta");
      }
    }
  }
}

const CAMPI = ["nome","categoria","colore_primario","colore_secondario","fantasia","materiale","composizione_testo","stagioni","calore","formalita","brand","taglia","lavaggio","temperatura"];
async function salva(b) {

  for (const k of Object.keys(doc)) if (doc[k] === null || doc[k] === undefined) delete doc[k];
  // Un documento può pesare al massimo 256 KiB: se serve, si rinuncia alle foto delle etichette.
  while (JSON.stringify(doc).length > 240000 && doc.etichette?.length) doc.etichette = doc.etichette.slice(1);
  const id = b.id || "capo_" + uid();
  if (!S.db) { S.capi = [{ id, ...doc }, ...S.capi.filter(c => c.id !== id)]; chiudiFoglio(); render(); return; }
  const btn = $('[data-act="salva"]'); if (btn) { btn.disabled = true; btn.textContent = "Salvo…"; }
  try { await S.db.collection("data/users/" + S.uid).doc(id).set(doc); chiudiFoglio(); }
  catch (e) {
    b.errore = e.code === "quota_exceeded" ? "Spazio dell'armadio esaurito: elimina qualche capo." : e.code === "invalid_argument" ? "Non hai i permessi per salvare in questo armadio." : "Salvataggio non riuscito: riprova.";

}
async function elimina(b) {
  if (!S.db) { S.capi = S.capi.filter(c => c.id !== b.id); chiudiFoglio(); render(); return; }

}

// ---------- Abbinamenti ----------
function hsl(hex) {
  const [r, g, b] = hexRgb(hex).map(v => v / 255), mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  if (!d) return [0, 0, l];
  const s = d / (1 - Math.abs(2 * l - 1));
  let h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [(h * 60 + 360) % 360, s, l];
}
function coppiaColori(a, b) {
  if (!a || !b) return [1, null];
  if (NEUTRI.has(a) || NEUTRI.has(b)) return [2, null];
  if (a === b) return [1.5, `tono su tono ${a}`];
  const ha = hsl(COLORI[a])[0], hb = hsl(COLORI[b])[0]; let d = Math.abs(ha - hb); d = Math.min(d, 360 - d);
  if (d <= 40) return [1.5, `colori vicini (${a} e ${b})`];
  if (d >= 150) return [1, `contrasto complementare (${a} e ${b})`];
  return [-1.5, `${a} e ${b} rischiano di stonare`];
}
function valuta(items, target) {
  let score = 0; const note = [];
  const colori = items.map(i => i.colore_primario).filter(Boolean);
  for (let i = 0; i < colori.length; i++) for (let j = i + 1; j < colori.length; j++) { const [s, n] = coppiaColori(colori[i], colori[j]); score += s; if (n && !note.includes(n)) note.push(n); }
  const accenti = [...new Set(colori.filter(c => !NEUTRI.has(c)))];
  if (accenti.length === 0) note.push("tutto su neutri");
  else if (accenti.length === 1) { score += 1; note.push(`neutri con un accento ${accenti[0]}`); }
  else if (accenti.length > 2) { score -= 2; note.push("troppi colori accesi"); }
  const fantasie = items.filter(i => i.fantasia && i.fantasia !== "tinta unita");
  if (fantasie.length > 1) { score -= 3; note.push("più di una fantasia"); } else if (fantasie.length === 1) note.push(`una sola fantasia (${fantasie[0].fantasia})`);
  const f = items.map(i => i.formalita).filter(Number.isFinite);
  const scarto = f.reduce((s, x) => s + Math.abs(x - target), 0);
  score -= scarto * 0.8;
  if (f.length && Math.max(...f) - Math.min(...f) >= 3) { score -= 2; note.push("formalità molto diverse tra i capi"); }
  return { score, note };
}
function generaOutfit() {
  const st = S.outfitStagione, target = S.outfitFormalita;
  const ok = c => !c.stagioni?.length || c.stagioni.includes(st);
  const per = m => S.capi.filter(c => MACRO[c.categoria] === m && ok(c));
  const sopra = per("sopra"), sotto = per("sotto"), interi = per("intero"), capi_s = per("capospalla"), scarpe = per("scarpe");
  const basi = [];
  sopra.forEach(t => sotto.forEach(bt => basi.push([t, bt])));
  interi.forEach(i => basi.push([i]));
  const freddo = st === "autunno" || st === "inverno";
  const cand = basi.map(base => {
    let items = base.slice();
    const migliore = (lista, obbligo) => { let best = null, bs = obbligo ? -1e9 : valuta(items, target).score;
      lista.forEach(x => { const s = valuta([...items, x], target).score; if (s > bs) { bs = s; best = x; } }); return best; };
    const cs = capi_s.length ? migliore(capi_s, freddo) : null; if (cs) items.push(cs);
    const sc = scarpe.length ? migliore(scarpe, true) : null; if (sc) items.push(sc);
    return { items, ...valuta(items, target) };
  }).sort((a, b) => b.score - a.score);
  const scelti = [], uso = {};
  for (const o of cand) {
    if (scelti.length >= 6) break;
    if (o.items.slice(0, 2).some(i => (uso[i.id] || 0) >= 2)) continue;
    o.items.forEach(i => uso[i.id] = (uso[i.id] || 0) + 1); scelti.push(o);
  }
  const mancano = [];
  if (!basi.length) {
    if (!sopra.length && !interi.length) mancano.push("capi sopra (t-shirt, camicie, maglie) o abiti");
    if (!sotto.length && !interi.length) mancano.push("capi sotto (pantaloni, gonne)");
  }
  S.outfit = { lista: scelti, mancano, stagione: st, formalita: target }; S.parere = null;
}

function vistaOutfit() {
  const o = S.outfit;
  const stag = STAGIONI.map(s => `<button class="chip" data-ostag="${s}" aria-pressed="${S.outfitStagione === s}">${cap(s)}</button>`).join("");
  const form = [[2, "Casual"], [3, "Smart casual"], [4, "Elegante"]].map(([k, l]) => `<button class="chip" data-oform="${k}" aria-pressed="${S.outfitFormalita === k}">${l}</button>`).join("");
  let corpo = "";

  else if (o) {

    else corpo = o.lista.map((x, i) => `<div class="outfit"><div class="row" style="justify-content:space-between"><h3>Abbinamento ${i + 1}</h3><span class="score">punteggio ${x.score.toFixed(1)}</span></div>
      <div class="items">${x.items.map(it => `<div class="it"><div class="ph">${it.immagine ? `<img src="${esc(it.immagine)}" alt="">` : `<span class="glyph" style="font-size:22px">${esc((it.categoria || "?")[0].toUpperCase())}</span>`}</div><span>${esc(it.nome || it.categoria)}</span></div>`).join("")}</div>

      (S.sample ? `<div class="stack" style="margin-top:4px"><button class="btn" data-act="parere" ${S.parere?.attesa ? "disabled" : ""}>Chiedi a Claude quale scegliere</button>
        ${S.parere ? `<div class="opinion">${S.parere.attesa && !S.parere.testo ? `<span class="row"><span class="spin"></span>Claude sta valutando…</span>` : esc(S.parere.testo || "")}</div>` : ""}</div>` : "");
  }

    <div class="stack"><div class="chips" role="group" aria-label="Stagione">${stag}</div><div class="chips" role="group" aria-label="Occasione">${form}</div>
    ${S.capi.length ? `<button class="btn primary" data-act="genera">Proponi abbinamenti</button>` : ""}${corpo}</div>`;
}

async function chiediParere() {
  const o = S.outfit; if (!o?.lista.length || !S.sample) return;
  const desc = it => [it.nome || it.categoria, it.colore_primario, it.fantasia !== "tinta unita" ? it.fantasia : null, it.materiale].filter(Boolean).join(", ");
  const prompt = `Sei uno stylist. Stagione: ${o.stagione}. Occasione: ${FORMALITA[o.formalita]}.
Questi abbinamenti sono stati composti da un armadio reale:
${o.lista.map((x, i) => `${i + 1}. ${x.items.map(desc).join(" + ")}`).join("\n")}

In italiano, in massimo 5 righe e senza elenchi puntati: indica il numero dell'abbinamento migliore per l'occasione e perché, e un ritocco concreto per uno degli altri. Non proporre capi che non sono nell'elenco.`;

// ---------- Qualità AI (metriche della Fase 0) ----------
const uguale = (a, b) => Array.isArray(a) || Array.isArray(b)
  ? JSON.stringify([...(a || [])].sort()) === JSON.stringify([...(b || [])].sort())
  : String(a ?? "").trim().toLowerCase() === String(b ?? "").trim().toLowerCase();
function metriche() {
  const agg = {};
  S.capi.forEach(c => Object.entries(c.proposta || {}).forEach(([k, val]) => {
    if (k.startsWith("nome|")) return; // il nome è testo libero: si modifica per gusto, non per errore
    const campo = k.split("|")[0]; (agg[k] ||= { n: 0, ok: 0 }); agg[k].n++; if (uguale(val, c[campo])) agg[k].ok++;
  }));
  const tempi = {};
  S.capi.filter(c => c.secondi_inserimento).forEach(c => {
    const m = (c.modalita || []).includes("foto") && (c.modalita || []).includes("etichetta") ? "foto + etichetta" : (c.modalita || [])[0] || "manuale";
    (tempi[m] ||= []).push(c.secondi_inserimento);
  });
  const conAI = S.capi.filter(c => Object.keys(c.proposta || {}).some(k => k.endsWith("|ai")));
  const zero = conAI.filter(c => ["categoria", "colore_primario", "fantasia", "stagioni", "formalita"].every(campo => !(campo + "|ai" in (c.proposta || {})) || uguale(c.proposta[campo + "|ai"], c[campo]))).length;
  return { agg, tempi, conAI: conAI.length, zero };
}
function vistaQualita() {
  const { agg, tempi, conAI, zero } = metriche();
  const nomiFonte = { ai: "Claude (foto)", etichetta: "Claude (etichetta)", pixel: "colore dai pixel" };
  const righe = Object.keys(agg).sort().map(k => {
    const [campo, fonte] = k.split("|"), { n, ok } = agg[k], acc = ok / n, soglia = SOGLIE[k];
    let pill = `<span class="pill na">informativo</span>`;
    if (soglia != null) pill = n < CAMPIONE_MIN ? `<span class="pill na">servono ${CAMPIONE_MIN - n} capi</span>` : acc >= soglia ? `<span class="pill ok">ok ≥ ${Math.round(soglia * 100)}%</span>` : `<span class="pill bad">sotto ${Math.round(soglia * 100)}%${BLOCCANTI.has(k) ? " · bloccante" : ""}</span>`;
    return `<tr><td>${esc(campo.replace("_testo", "").replace("_", " "))}<div class="hint">${nomiFonte[fonte] || fonte}</div></td><td class="n">${Math.round(acc * 100)}%<div class="hint">${ok}/${n}</div></td><td>${pill}</td></tr>`;
  }).join("");
  const bloccantiOk = [...BLOCCANTI].every(k => agg[k] && agg[k].n >= CAMPIONE_MIN && agg[k].ok / agg[k].n >= SOGLIE[k]);
  const bloccantiValutati = [...BLOCCANTI].every(k => agg[k] && agg[k].n >= CAMPIONE_MIN);
  const esito = !bloccantiValutati ? `<span class="pill na">dati insufficienti</span>` : bloccantiOk ? `<span class="pill ok">GO</span>` : `<span class="pill bad">NO-GO</span>`;
  const media = a => Math.round(a.reduce((s, x) => s + x, 0) / a.length);
  return `<div class="top"><div><h1>Qualità AI</h1><div class="count">quanto spesso accetti la proposta senza correggerla</div></div></div>
  <div class="stack">
    <div class="kpis">
      <div class="kpi"><span class="muted">Esito Fase 0</span><b>${esito}</b><span class="hint">campi bloccanti, almeno ${CAMPIONE_MIN} capi</span></div>
      <div class="kpi"><span class="muted">Schede da foto senza correzioni</span><b>${conAI ? Math.round(zero / conAI * 100) + "%" : "—"}</b><span class="hint">${zero} su ${conAI} (categoria, colori, fantasia, stagioni, formalità)</span></div>
      ${Object.entries(tempi).map(([m, a]) => `<div class="kpi"><span class="muted">Tempo medio · ${esc(m)}</span><b>${media(a)} s</b><span class="hint">${a.length} capi</span></div>`).join("")}
    </div>
    ${righe ? `<div class="tablewrap"><table class="q"><thead><tr><th>Campo</th><th class="n">Accettati</th><th>Soglia</th></tr></thead><tbody>${righe}</tbody></table></div>`
      : `<div class="banner">Le metriche compaiono quando aggiungi capi con foto o etichetta. Ogni volta che correggi un valore proposto, qui conta come errore.</div>`}
    <p class="hint">Un valore conta come corretto se lo salvi senza modificarlo: se non controlli la scheda prima di salvare, l'accuratezza risulta più alta del reale. Soglie: ipotesi di lavoro, da rivedere dopo i primi 25 capi.</p>
  </div>`;
}

// ---------- Eventi globali ----------
document.addEventListener("click", e => {
  if (!document.body.contains(e.target)) return; // il foglio ha già ridisegnato il proprio contenuto
  const nav = e.target.closest("#bar button[data-view]");
  if (nav) { if (nav.dataset.view === "aggiungi") return sceltaAggiunta(); S.view = nav.dataset.view; render(); window.scrollTo(0, 0); return; }
  if (e.target.closest("#modal")) { const c = e.target.closest('[data-act="chiudi"]'); if (c) chiudiFoglio(); return; }
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.filtro) { S.filtro = t.dataset.filtro; render(); }
  else if (t.dataset.stag) { S.stagione = t.dataset.stag; render(); }
  else if (t.dataset.capo) { const c = S.capi.find(x => x.id === t.dataset.capo); if (c) apriEditor(bozzaDaCapo(c)); }
  else if (t.dataset.ostag) { S.outfitStagione = t.dataset.ostag; S.outfit = null; render(); }
  else if (t.dataset.oform) { S.outfitFormalita = Number(t.dataset.oform); S.outfit = null; render(); }
  else if (t.dataset.act === "aggiungi") sceltaAggiunta();
  else if (t.dataset.act === "genera") { generaOutfit(); render(); }
  else if (t.dataset.act === "parere") chiediParere();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#modal").innerHTML) chiudiFoglio(); });

avvia();
</script>
